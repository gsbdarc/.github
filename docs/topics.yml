# PROPOSED topic assignment for every repository in the gsbdarc organization.
#
# STATUS: proposed, not adopted. Nothing here has been applied to any repo.
# docs/repo-topics.md is the proposal: the taxonomy, the per-repo table and
# the apply summary. Its generated section is rendered from this file.
#
#   ./scripts/apply-topics.py            # validate + show the diff (writes nothing)
#   ./scripts/apply-topics.py --render   # regenerate the tables in repo-topics.md
#   ./scripts/apply-topics.py --apply    # write (requires confirmation)
#
# After editing this file, run --render. `--check` fails if you forget.
#
# Per-repo invariants the script enforces:
#   - exactly one work-type topic
#   - exactly one status-* topic
#   - status-inactive / status-archived must carry a last-active-YYYY
#   - at most 20 topics (GitHub's limit)
#
# The final list per repo is:  (what the repo already has | what is listed here)
# minus `remove:` below. So the only topics ever deleted are the ones explicitly
# enumerated -- absence from this file is NOT a delete signal.
#
# That distinction is deliberate. Dropping vendor tags and artifact types from
# the *vocabulary* is a decision about what to tag going forward; it must not
# silently become "delete the ones already there". Under an authoritative script
# this file would wipe 32 tags across 11 repos, of which only 13 are actually
# deprecated -- the other 19 are vendor tags and `etl-pipeline` that were set
# deliberately. Enumerating removals keeps each deletion a decision somebody
# wrote down, and leaves hand-tagging in the GitHub UI working.

# Topics to DELETE wherever they appear. `instead` must be a term the taxonomy
# actually defines -- the validator refuses a replacement that doesn't exist,
# because a doc that tells people to use an undefined term is worse than one
# that says nothing. `why` is what the generated table prints.
remove:
  data-engineering:
    instead: data-delivery
    why: could not tell a school-wide data asset from one PI's pipeline
  etl: &pipeline
    instead: data-delivery
    why: the work type already says this is a data pipeline
  data-etl: *pipeline
  survey:
    instead: qualtrics
    why: every repo carrying it is a Qualtrics instrument, already tagged
  etl-pipeline:
    instead: data-delivery
    why: >-
      redundant -- 13 of the 15 repos carrying it are already `data-delivery`
  sp-global: &vendor
    why: >-
      the vendor belongs in the repo name; the facet reached only 9 of 15 data
      repos, so its absence meant nothing
  pitchbook: *vendor
  kpler: *vendor
  comscore: *vendor
  data-axle: *vendor
  dun-and-bradstreet: *vendor
  sensor-tower: *vendor
  freightos: *vendor
  javascript:
    why: GitHub derives languages from file contents
  template:
    why: GitHub has its own template-repo flag, shown as a badge on the repo

# The vocabulary, machine-readable. docs/repo-topics.md is the prose version;
# apply-topics.py checks neither has a term the other lacks, so they can't drift.
facets:
  work-type:      # exactly one per repo -- what kind of work this is
    [data-delivery, app-build, research-computing, research-support, training, internal-ops]
  client:         # optional -- who it is for, orthogonal to work type
    [faculty-project]
  stack:          # optional -- what it runs on, or what shape it is.
                  # Only terms earned by >=2 repos.
    [aws, claude-code, docker, google-cloud, gpu, llm, qualtrics, redivis, sherlock, slurm, terraform, web-scraping, yens]
  lifecycle:      # exactly one per repo
    [status-active, status-maintained, status-inactive, status-archived,
     status-experimental]
  year:           # required with status-inactive / status-archived
    [last-active-2023, last-active-2024, last-active-2025, last-active-2026]

# Vendors are deliberately NOT topics. `q=pitchbook in:name` already finds
# pitchbook-feed-ETL, and of all 75 repos exactly one has a data source
# invisible in its name (gelfand_scientific-disciplines-datasets -> Web of
# Science) -- one repo does not justify a 16-term facet. Put the vendor in the
